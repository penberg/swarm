[package]
name = "swarm-gtk"
version = "0.1.4"
edition = "2024"
repository = "https://github.com/penberg/swarm"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
libghostty-vt = "0.1.1"
pangocairo = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
swarm-core = { path = "../core" }

[[bin]]
name = "swarm"
path = "swarm.rs"

[package]
name = "swarm-cli"
version = "0.1.4"
edition = "2024"
repository = "https://github.com/penberg/swarm"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
swarm-core = { path = "../core" }

[[bin]]
name = "swarmctl"
path = "main.rs"
